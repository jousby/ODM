name: Build PRs

on:
  pull_request:
  workflow_dispatch:

# A superseded run tells us nothing, and the GPU image takes about an hour to
# build, so let a new push to the same ref replace the one in flight.
concurrency:
  group: build-prs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixi:
    strategy:
      matrix:
        platform:
          - ubuntu-latest
          - windows-2022
          - macos-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: latest
    - name: Install environment
      run: pixi install --locked
    - name: Build SuperBuild
      run: pixi run build
    - name: Test
      run: pixi run test
    - name: Smoke
      run: pixi run smoke
    - name: Install prod environment
      run: pixi install --locked -e prod
    - name: Prod smoke
      run: pixi run -e prod smoke

  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build runtime image
      uses: docker/build-push-action@v6
      with:
        file: ./Dockerfile
        target: runtime
        platforms: linux/amd64
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  docker-gpu:
    # The repository is public and the runner is self-hosted, so this must never
    # run code from a fork. Branches pushed to the repository itself only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build runtime image
      uses: docker/build-push-action@v6
      with:
        file: ./gpu.Dockerfile
        target: runtime
        push: false
    - name: Reclaim space
      if: always()
      run: |
        docker builder prune -af
        docker image prune -f
        df -h /
